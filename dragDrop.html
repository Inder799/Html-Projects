<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            width: 350px;
            height: 350px;
            padding: 10px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div id="container" ondragover="allowDrop(event)" ondrop="drop(event)">

    </div>
    <br>
    <img id="myimage" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQT1yhZgfX3VKNMM9IUCypuplwWxV9xeDOuyg&s" alt="image" draggable="true" width="250" height="180" ondragstart="drag(event)">
</body>

<script>
    function allowDrop(e){
        // alert(e.target.id);
        e.preventDefault();
    }
    function drag(e) {
        // alert(e.target.id);
        e.dataTransfer.setData("myimagetotransfer", e.target.id)
    }

    function drop(e) {
        e.preventDefault();
        var data = e.dataTransfer.getData("myimagetotransfer")
        e.target.appendChild(document.getElementById(data));
    }
</script>
</html>
